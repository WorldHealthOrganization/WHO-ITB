# Serves this plugin's dialect/ folder at the well-known /gherkin-dialect
# path — deployed services are self-describing: the language definition you
# author against is exactly the one this running service version understands.
#
# CORS is mandatory: the authoring app (itb-plugin-authoring) is a static
# browser app (GitHub Pages) and cannot load the dialect without it.
server {
    listen 8080;

    location /gherkin-dialect/ {
        alias /srv/dialect/;
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /health {
        return 204;
    }
}
