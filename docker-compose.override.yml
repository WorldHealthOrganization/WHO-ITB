# Example override file for adding plugins.
# Copy this to docker-compose.override.yml and uncomment the services you need.
# Or use a recipe from https://github.com/HealthOpenSpace/itb-plugins/tree/main/recipes
#
# Usage:
#   cp docker-compose.override.yml.example docker-compose.override.yml
#   # edit to enable services
#   docker compose up -d

services: 

  # Prebuilt validator image from the WorldHealthOrganization fork, published
  # by its itb-rest-docker-image workflow on every push to that branch, until
  # the ITB changes are merged into the core validator; then this points at
  # the image the core project publishes. ci-build is the latest build; pin
  # FHIR_VALIDATOR_IMAGE to an itb-rest-docker-image-<sha> tag for a
  # reproducible deployment. The jar-download variant remains in
  # docker-compose.override-jar.yml.
  fhir-validator:
    image: ${FHIR_VALIDATOR_IMAGE:-ghcr.io/worldhealthorganization/fhir-validator:ci-build}
    container_name: fhir-validator
    restart: unless-stopped
    ports:
      - "8088:8080"
      - "8080:8080"
    environment:
      - FHIR_VERSION=5.0
      - JAVA_TOOL_OPTIONS=${FHIR_VALIDATOR_JAVA_TOOL_OPTIONS:--Xmx8g}
    volumes:
      # Package cache; the image runs as the validator user with HOME=/home/validator.
      - fhir-packages-cache:/home/validator/.fhir

  # Self-describing dialect endpoint for the FHIR validator: serves the plugin's
  # Gherkin dialect (vendored under plugins/fhir-validator/dialect/) at the
  # well-known /gherkin-dialect path with CORS, so the authoring app loads the
  # language extension straight from this deployment. Sidecar because
  # validator_cli.jar cannot serve static files. Mirrors the canonical
  # itb-plugin-fhir-validator compose fragment.
  fhir-gherkin-dialect:
    image: nginx:1.27-alpine
    container_name: fhir-gherkin-dialect
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./plugins/fhir-validator/dialect:/srv/dialect:ro
      - ./plugins/fhir-validator/dialect-server.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gherkin-dialect/component.yml"]
      interval: 30s
      timeout: 5s
      retries: 3

  hcert-validator:
    # TODO: switch back to costateixeira/gdhcn-validator:<tag> once a build newer
    # than 0.2.0 (which is missing /verify/signature and other endpoints) is published.
    build:
      context: ./gdhcn-helper
      dockerfile: Dockerfile
    # Rebuild from ./gdhcn-helper on every `up`, so a stale auto-named image
    # is never silently reused when someone forgets `--build`.
    pull_policy: build
    container_name: hcert-validator
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-describing dialect endpoint for the HCERT decoder (same pattern as
  # fhir-gherkin-dialect). Note: the canonical itb-plugin-hcert-decoder repo
  # does not ship this sidecar yet — WHO-ITB is ahead here; upstream it when
  # convenient.
  hcert-gherkin-dialect:
    image: nginx:1.27-alpine
    container_name: hcert-gherkin-dialect
    restart: unless-stopped
    ports:
      - "8091:8080"
    volumes:
      - ./plugins/hcert-decoder/dialect:/srv/dialect:ro
      - ./plugins/hcert-decoder/dialect-server.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gherkin-dialect/component.yml"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Not needed for ph4h-qr test ──
  # fhir-validator handles IG load, StructureMap transform, and profile
  # validation natively via /itb/{igManager,transform,fhir}/process. The
  # vhl/icvp test suites still need fhir-server + matchbox + smart-helper;
  # see e:/work/WHO-ITB/docker-compose.override.yml for that stack.

volumes:
  fhir-packages-cache:
